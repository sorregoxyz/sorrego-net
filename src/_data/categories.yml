# Single source of truth for pastel colors + nav labels.
# Add a new theme by adding an entry under `categories` — no template changes needed.

# Top-level homepage nav chips (Things I've Done / Cabinet / Archive)
main_nav:
  - slug: things-ive-done
    label: "things I've done"
    url: /tid/
    # PLACEHOLDER — "Things I've Done" wraps 3 sub-themes with their own colors
    # (sand / sage / lavender-grey below). Needs a color decision: pick one of
    # the three, or a neutral chip color distinct from all sub-theme colors.
    color: "#A4E0FC"
  - slug: cabinet-of-definitions
    label: "cabinet of definitions"
    url: /cabinet/
    color: "#C8FCA4"
  - slug: blog
    label: "blog"
    url: /blog/
    color: "#FCE08C "

# Thematic categories under "Things I've Done" — each is a literal folder
# under content/, e.g. content/multimodal-experiments/
# `image` is the base path (no size suffix); `image_widths` lists the
# actual generated widths, used to build a srcset on the /tid/ cards.
categories:
  - slug: more-than-human-ethnography
    label: "more-than-human ethnography"
    color: "#A1E6E2"
    image: "/assets/images/things/multispecies"
    image_widths: [730, 1095, 1825]
  - slug: multimodal-experiments
    label: "multimodal experiments"
    color: "#F6BDF2"
    image: "/assets/images/things/multimodal"
    image_widths: [730, 1095, 1825]
  - slug: urban-infrastructures
    label: "urban infrastructures"
    color: "#F5F556"
    image: "/assets/images/things/infrastructure"
    image_widths: [730, 1025, 1095]
